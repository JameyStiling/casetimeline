services:
  # Backend Express API Service
  - type: web
    name: case-timeline-api
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: PORT
        value: 3001
      - key: GEMINI_API_KEY
        sync: false # Set in the Render dashboard

  # Frontend Vite React Static Site
  - type: static
    name: case-timeline-client
    env: static
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    publishDir: dist
    headers:
      - path: /*
        headers:
          - key: Cache-Control
            value: public, max-age=31536000, immutable
    envVars:
      - key: VITE_API_URL
        fromService:
          name: case-timeline-api
          type: web
          property: host
